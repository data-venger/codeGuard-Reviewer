version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codeguard-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1g
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped
