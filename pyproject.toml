[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard"
version = "0.1.0"
description = "RAG-Based PR Reviewer — Org-Aware, Local-First AI Code Review"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "qdrant-client>=1.7.0",
    "fastembed>=0.2.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]
ui = [
    "streamlit>=1.30.0",
]
agent = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
]

[project.scripts]
codeguard-ingest = "scripts.ingest:cli"

[tool.setuptools.packages.find]
include = ["codeguard*", "config*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
